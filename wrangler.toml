# Cloudflare Pages — static export from Next.js (output: out/)
name = "brkmb-portfolio"
compatibility_date = "2025-05-01"
pages_build_output_dir = "out"

# Design engagement (views, likes, comments) — create DB then set database_id:
#   wrangler d1 create brkmb-portfolio-engagement
#   wrangler d1 execute brkmb-portfolio-engagement --remote --file=./migrations/d1/001_design_engagement.sql
# Then bind in Cloudflare Dashboard → Pages → Settings → Functions → D1 bindings (name: DB)
[[d1_databases]]
binding = "DB"
database_name = "brkmb-portfolio-engagement"
database_id = "00000000-0000-0000-0000-000000000000"
